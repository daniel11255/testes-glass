<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EDE6">
<title>Portal | 1INFO-2</title>
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="index">
<div class="page-shell">
    <div class="clock-block">
      <div class="clock-time"><span id="clock-hm">--:--</span><span class="clock-secs" id="clock-ss">--</span></div>
      <div class="clock-weekday" id="clock-weekday">---</div>
      <div class="clock-date"    id="clock-date">---</div>
    </div>

    <div class="schedule-card">
      <div class="schedule-header">
        <div class="schedule-header-left">
          <div style="width: 32px; height: 32px; background: var(--accent-lt); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--accent);">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <span class="schedule-eyebrow">Próximas Aulas</span>
          <span class="schedule-today-badge" id="schedule-day-badge">---</span>
        </div>
        <span class="schedule-count" id="schedule-count"></span>
      </div>
      <div id="today-schedule"></div>
    </div>

    <div class="schedule-card" id="bus-quick-card">
      <div class="schedule-header">
        <div class="schedule-header-left">
          <div style="width: 32px; height: 32px; background: var(--surface-2); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text); border: 1px solid var(--border);">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M7 8h10M7 11h5"/>
            </svg>
          </div>
          <span class="schedule-eyebrow">Próximos Ônibus</span>
        </div>
        <a href="onibus.html" class="bus-quick-link">Ver tudo <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
      </div>
      <div id="bus-quick-rows"></div>
    </div>

    <div class="schedule-card" id="other-bus-quick-card">
      <div class="schedule-header">
        <div class="schedule-header-left">
          <div style="width: 32px; height: 32px; background: var(--surface-2); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text); border: 1px solid var(--border);">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
          </div>
          <span class="schedule-eyebrow">Próximos Ônibus · Outras Linhas</span>
        </div>
        <a href="onibus.html" class="bus-quick-link">Ver tudo <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
      </div>
      <div id="other-bus-quick-rows"></div>
    </div>

    <div class="section-label">Acesso Rápido</div>
    <div class="cards-grid">
      <a href="aulas.html" class="feature-card">
        <div class="card-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        <div class="card-body">
          <div class="card-title">Grade de Aulas</div>
          <div class="card-cta">Ver grade <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
        </div>
      </a>
      <a href="calendario.html" class="feature-card card-calendar">
        <div class="card-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg></div>
        <div class="card-body">
          <div class="card-title">Calendário</div>
          <div class="card-cta">Abrir calendário <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
        </div>
      </a>
      <a href="onibus.html" class="feature-card card-bus">
        <div class="card-icon"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M7 8h10M7 11h5"/></svg></div>
        <div class="card-body">
          <div class="card-title">Horários de Ônibus</div>
          <div class="card-cta">Ver horários <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
        </div>
      </a>
      <a href="horarios.html" class="feature-card card-profs">
        <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-8 0v2"/><circle cx="12" cy="7" r="4"/></svg></div>
        <div class="card-body">
          <div class="card-title">Atendimento de Professores</div>
          <div class="card-cta">Ver professores <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
        </div>
      </a>
    </div>
  </div>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="index.js"></script>
<script src="glass.js"></script>
</body>
</html>
